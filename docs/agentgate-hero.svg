<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 586" role="img" aria-labelledby="title desc">
  <title id="title">AgentGate refund investigation workflow</title>
  <desc id="desc">A visual workflow from a customer request through evidence retrieval, Gemini investigation, policy guardrails, merchant submission, and a PayPal Sandbox outcome.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04172f"/>
      <stop offset="0.6" stop-color="#0d2d4b"/>
      <stop offset="1" stop-color="#0a1f35"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f5ff"/>
      <stop offset="1" stop-color="#36bfff"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.22"/>
    </filter>

    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#9edfff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="20" y="8" width="1496" height="570" rx="28" fill="url(#bg)"/>
  <rect x="20" y="8" width="1496" height="570" rx="28" fill="url(#grid)"/>

  <circle cx="1295" cy="25" r="255" fill="#33bfff" opacity="0.12"/>
  <circle cx="60" cy="590" r="365" fill="#2f73ff" opacity="0.10"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <!-- logo -->
    <g transform="translate(108 86)">
      <path d="M26 0 51 14v30L26 58 1 44V14Z" fill="none" stroke="url(#cyan)" stroke-width="2.5"/>
      <path d="M26 16 38 23v12L26 42 14 35V23Z" fill="url(#cyan)"/>
      <text x="73" y="27" fill="#f4fbff" font-size="28" font-weight="700">AgentGate</text>
      <text x="73" y="55" fill="#9fb9cc" font-size="18" letter-spacing="2">MERCHANT REFUND CONTROL DESK</text>
    </g>

    <!-- headline -->
    <text x="108" y="236" fill="#f4f9ff" font-size="62" font-weight="700" letter-spacing="-2.4">
      Every refund, under control.
    </text>
    <text x="108" y="288" fill="#b9cbda" font-size="28">
      Investigate the facts. Enforce policy. Let the merchant decide.
    </text>

    <!-- status pill -->
    <g transform="translate(108 330)" filter="url(#softShadow)">
      <rect width="252" height="44" rx="22" fill="#0b223a" stroke="#3fbdf2" stroke-opacity="0.75" stroke-width="1.5"/>
      <circle cx="26" cy="22" r="6.5" fill="#42e4b2" filter="url(#glow)"/>
      <text x="44" y="28" fill="#e6f8ff" font-size="16" font-weight="700">PAYPAL SANDBOX READY</text>
    </g>

    <!-- connection lines -->
    <g fill="none" stroke="#57ccff" stroke-opacity="0.62" stroke-width="3" stroke-linecap="round">
      <path d="M764 416 C792 416 794 388 824 388"/>
      <path d="M956 388 C990 388 992 318 1028 318"/>
      <path d="M1168 318 C1204 318 1204 416 1242 416"/>
      <path d="M1380 416 C1412 416 1412 318 1446 318"/>
    </g>

    <!-- line dots -->
    <g fill="#54cfff" filter="url(#glow)">
      <circle cx="764" cy="416" r="5"/>
      <circle cx="824" cy="388" r="5"/>
      <circle cx="1028" cy="318" r="5"/>
      <circle cx="1242" cy="416" r="5"/>
      <circle cx="1446" cy="318" r="5"/>
    </g>

    <!-- workflow cards -->
    <g filter="url(#softShadow)">
      <!-- 01 -->
      <g transform="translate(604 404)">
        <rect width="160" height="88" rx="18" fill="#102b45" stroke="#4cc8ff" stroke-opacity="0.55" stroke-width="1.5"/>
        <text x="18" y="30" fill="#c1e9fb" font-size="15" font-weight="700">01</text>
        <text x="18" y="56" fill="#f3fbff" font-size="17" font-weight="700">
          <tspan x="18" dy="0">Customer</tspan>
          <tspan x="18" dy="20">request</tspan>
        </text>
      </g>

      <!-- 02 -->
      <g transform="translate(824 346)">
        <rect width="150" height="88" rx="18" fill="#102b45" stroke="#4cc8ff" stroke-opacity="0.55" stroke-width="1.5"/>
        <text x="18" y="30" fill="#c1e9fb" font-size="15" font-weight="700">02</text>
        <text x="18" y="56" fill="#f3fbff" font-size="17" font-weight="700">
          <tspan x="18" dy="0">Evidence</tspan>
          <tspan x="18" dy="20">retrieval</tspan>
        </text>
      </g>

      <!-- 03 -->
      <g transform="translate(1028 274)">
        <rect width="170" height="88" rx="18" fill="#123a57" stroke="#63d8ff" stroke-width="2"/>
        <text x="18" y="30" fill="#d3f7ff" font-size="15" font-weight="700">03</text>
        <text x="18" y="56" fill="#ffffff" font-size="17" font-weight="700">
          <tspan x="18" dy="0">Gemini</tspan>
          <tspan x="18" dy="20">investigates</tspan>
        </text>
      </g>

      <!-- 04 -->
      <g transform="translate(1180 372)">
        <rect width="152" height="88" rx="18" fill="#102b45" stroke="#4cc8ff" stroke-opacity="0.55" stroke-width="1.5"/>
        <text x="18" y="30" fill="#c1e9fb" font-size="15" font-weight="700">04</text>
        <text x="18" y="56" fill="#f3fbff" font-size="17" font-weight="700">
          <tspan x="18" dy="0">Policy</tspan>
          <tspan x="18" dy="20">guardrails</tspan>
        </text>
      </g>

      <!-- 05 -->
      <g transform="translate(1328 274)">
        <rect width="142" height="88" rx="18" fill="#102b45" stroke="#4cc8ff" stroke-opacity="0.55" stroke-width="1.5"/>
        <text x="18" y="30" fill="#c1e9fb" font-size="15" font-weight="700">05</text>
        <text x="18" y="56" fill="#f3fbff" font-size="17" font-weight="700">
          <tspan x="18" dy="0">Merchant</tspan>
          <tspan x="18" dy="20">submits</tspan>
        </text>
      </g>
    </g>

    <!-- outcome pill -->
    <g transform="translate(960 505)" filter="url(#softShadow)">
      <rect width="500" height="50" rx="16" fill="#0b2435" stroke="#3fc9ac" stroke-opacity="0.76" stroke-width="1.5"/>
      <circle cx="28" cy="25" r="7" fill="#43dfa9"/>
      <text x="50" y="31" fill="#e2fff3" font-size="18" font-weight="700">PayPal Sandbox outcome</text>
      <text x="286" y="31" fill="#9fc8c1" font-size="17">provider ID + audit record</text>
    </g>
  </g>
</svg>
