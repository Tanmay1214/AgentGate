<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AgentGate refund investigation workflow</title>
  <desc id="desc">A visual workflow from a customer request through evidence, Gemini investigation, policy guardrails, merchant approval and a PayPal Sandbox outcome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset=".58" stop-color="#102d4c"/><stop offset="1" stop-color="#081321"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9f5ff"/><stop offset="1" stop-color="#36bfff"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#9edfff" stroke-opacity=".085"/></pattern>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/><rect width="1200" height="500" rx="28" fill="url(#grid)"/>
  <circle cx="1034" cy="-15" r="235" fill="#27b7ed" opacity=".13"/><circle cx="95" cy="478" r="230" fill="#2679ed" opacity=".10"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(70 65)"><path d="M22 0 42 12v24L22 48 2 36V12Z" fill="none" stroke="url(#cyan)" stroke-width="2"/><path d="m22 14 10 6v8l-10 6-10-6v-8Z" fill="url(#cyan)"/><text x="61" y="24" fill="#f4fbff" font-size="25" font-weight="700" letter-spacing="-.7">AgentGate</text><text x="61" y="45" fill="#9ec1d7" font-size="13" letter-spacing="1.8">MERCHANT REFUND CONTROL DESK</text></g>
    <text x="70" y="186" fill="#f8fcff" font-size="48" font-weight="700" letter-spacing="-2.1">Every refund, under control.</text><text x="70" y="225" fill="#bdd2e2" font-size="19">Investigate the facts. Enforce policy. Let the merchant decide.</text>
    <rect x="70" y="259" width="204" height="36" rx="18" fill="#0b223a" stroke="#3fbdf2" stroke-opacity=".65"/><circle cx="91" cy="277" r="5" fill="#42e4b2" filter="url(#glow)"/><text x="106" y="282" fill="#daf5ff" font-size="14" font-weight="700">PAYPAL SANDBOX READY</text>
    <g fill="none" stroke="#55cbff" stroke-opacity=".5" stroke-width="2"><path d="M515 359 C560 359 556 303 600 303"/><path d="M660 303 C701 303 701 245 747 245"/><path d="M807 245 C849 245 850 323 896 323"/><path d="M956 323 C994 323 997 245 1043 245"/></g><g fill="#54cfff" filter="url(#glow)"><circle cx="515" cy="359" r="4"/><circle cx="600" cy="303" r="4"/><circle cx="747" cy="245" r="4"/><circle cx="896" cy="323" r="4"/><circle cx="1043" cy="245" r="4"/></g>
    <g><g transform="translate(468 324)"><rect width="112" height="70" rx="14" fill="#102b45" stroke="#4cc8ff" stroke-opacity=".52"/><text x="14" y="28" fill="#c1e9fb" font-size="11" font-weight="700">01</text><text x="14" y="50" fill="#f3fbff" font-size="14" font-weight="700">Customer request</text></g><g transform="translate(600 268)"><rect width="120" height="70" rx="14" fill="#102b45" stroke="#4cc8ff" stroke-opacity=".52"/><text x="14" y="28" fill="#c1e9fb" font-size="11" font-weight="700">02</text><text x="14" y="50" fill="#f3fbff" font-size="14" font-weight="700">Evidence retrieval</text></g><g transform="translate(747 210)"><rect width="120" height="70" rx="14" fill="#123a57" stroke="#63d8ff" stroke-width="1.5"/><text x="14" y="28" fill="#d3f7ff" font-size="11" font-weight="700">03</text><text x="14" y="50" fill="#fff" font-size="14" font-weight="700">Gemini investigates</text></g><g transform="translate(896 288)"><rect width="120" height="70" rx="14" fill="#102b45" stroke="#4cc8ff" stroke-opacity=".52"/><text x="14" y="28" fill="#c1e9fb" font-size="11" font-weight="700">04</text><text x="14" y="50" fill="#f3fbff" font-size="14" font-weight="700">Policy guardrails</text></g><g transform="translate(1043 210)"><rect width="112" height="70" rx="14" fill="#102b45" stroke="#4cc8ff" stroke-opacity=".52"/><text x="14" y="28" fill="#c1e9fb" font-size="11" font-weight="700">05</text><text x="14" y="50" fill="#f3fbff" font-size="14" font-weight="700">Merchant submits</text></g></g>
    <g transform="translate(747 406)"><rect width="408" height="40" rx="12" fill="#0b2435" stroke="#3fc9ac" stroke-opacity=".62"/><circle cx="21" cy="20" r="5" fill="#43dfa9"/><text x="38" y="25" fill="#dcfff2" font-size="14" font-weight="700">PayPal Sandbox outcome</text><text x="225" y="25" fill="#9fc8c1" font-size="13">provider ID + audit record</text></g>
  </g>
</svg>
